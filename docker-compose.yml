services:
  api:
    build: .
    image: chunked-upload-api:latest
    environment:
      DATA_DIR: /data
      # small checkpoints + short lease so the acceptance run exercises
      # several checkpoints and a fast post-crash takeover
      FINALIZE_CHECKPOINT_BYTES: "262144"
      FINALIZE_LEASE_TTL_SECONDS: "2"
    volumes:
      - upload-data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  verify:
    image: chunked-upload-api:latest
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      VERIFY_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      # lets the acceptance client SIGKILL and restart the api container to
      # prove crash recovery; without it that section is skipped
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "app.verify"]
    restart: "no"

volumes:
  upload-data:
